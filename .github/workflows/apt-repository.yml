name: Publish Debian APT Repository

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: apt-pages
  cancel-in-progress: false

jobs:
  build-repository:
    runs-on: ubuntu-latest
    steps:
      - name: Install APT repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils dpkg-dev gnupg

      - name: Download Debian packages from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p site/pool/main
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
          else
            tag="$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq '.tagName')"
          fi
          echo "Using release: $tag"
          gh release download "$tag" --repo "${GITHUB_REPOSITORY}" --pattern '*.deb' --dir site/pool/main --clobber
          test -n "$(find site/pool/main -maxdepth 1 -type f -name '*.deb' -print -quit)"
          ls -lh site/pool/main/*.deb

      - name: Normalize Debian architectures
        run: |
          set -euo pipefail
          for deb in site/pool/main/*.deb; do
            arch="$(dpkg-deb -f "$deb" Architecture)"
            case "$arch" in
              amd64|arm64|all) target="$arch" ;;
              x86_64) target="amd64" ;;
              aarch64) target="arm64" ;;
              *) echo "Unsupported Debian architecture in $deb: $arch"; exit 1 ;;
            esac
            if [ "$arch" != "$target" ]; then
              tmp="$(mktemp -d)"
              dpkg-deb -R "$deb" "$tmp"
              sed -i "s/^Architecture: .*/Architecture: $target/" "$tmp/DEBIAN/control"
              dpkg-deb -b "$tmp" "$deb.new" >/dev/null
              mv "$deb.new" "$deb"
              rm -rf "$tmp"
            fi
          done

      - name: Import APT signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${APT_GPG_PRIVATE_KEY:-}"
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          key_id="$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')"
          test -n "$key_id"
          echo "APT_KEY_ID=$key_id" >> "$GITHUB_ENV"
          gpg --batch --armor --export "$key_id" > site/apt.gpg

      - name: Build APT metadata
        env:
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          printf '%s\n' "${{ secrets.APT_GPG_PRIVATE_KEY }}" | gpg --batch --import
          mkdir -p site/dists/stable/main/binary-amd64
          cd site
          dpkg-scanpackages --arch amd64 pool/main /dev/null > dists/stable/main/binary-amd64/Packages
          gzip -9c dists/stable/main/binary-amd64/Packages > dists/stable/main/binary-amd64/Packages.gz
          apt-ftparchive -o APT::FTPArchive::Release::Origin="Almezali" -o APT::FTPArchive::Release::Label="Conky Manager GTK" -o APT::FTPArchive::Release::Suite="stable" -o APT::FTPArchive::Release::Codename="stable" -o APT::FTPArchive::Release::Architectures="amd64" -o APT::FTPArchive::Release::Components="main" release dists/stable > dists/stable/Release
          sign_args=(--batch --yes --pinentry-mode loopback)
          if [ -n "${APT_GPG_PASSPHRASE:-}" ]; then sign_args+=(--passphrase "${APT_GPG_PASSPHRASE}"); fi
          gpg "${sign_args[@]}" --local-user "${APT_KEY_ID}" --clearsign --digest-algo SHA256 --output dists/stable/InRelease dists/stable/Release
          gpg "${sign_args[@]}" --local-user "${APT_KEY_ID}" --armor --detach-sign --digest-algo SHA256 --output dists/stable/Release.gpg dists/stable/Release
          touch .nojekyll
          grep -q '^Package: conky-manager-g

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build-repository
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy APT repository
        id: deployment
        uses: actions/deploy-pages@v4
 dists/stable/main/binary-amd64/Packages
          grep -E '^(Package|Version|Architecture|Filename):' dists/stable/main/binary-amd64/Packages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build-repository
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy APT repository
        id: deployment
        uses: actions/deploy-pages@v4
